name: PR Review Bot (ADK)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-review-bot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      # Checkout the repo where the PR is happening
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Checkout your bot repo into a subfolder
      - name: Checkout pr-review-bot
        uses: actions/checkout@v4
        with:
          repository: Amir1411/pr-review-bot
          ref: main
          path: pr-review-bot
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install dependencies INSIDE pr-review-bot
      - name: Install bot dependencies
        working-directory: pr-review-bot
        run: npm install --legacy-peer-deps

      - name: Run PR review bot
        working-directory: pr-review-bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_MODEL: gemini-2.5-flash
        run: |
          PR_URL="${{ github.event.pull_request.html_url }}"
          echo "Reviewing: $PR_URL"

          # IMPORTANT: call ADK explicitly to avoid "could not determine executable"
          OUT="$(printf "%s\n" "$PR_URL" | ./node_modules/.bin/adk run src/agent.ts)"

          echo "---- BOT OUTPUT START ----"
          echo "$OUT"
          echo "---- BOT OUTPUT END ----"

          # Job summary
          {
            echo "## PR Review Bot Report"
            echo ""
            echo "**PR:** $PR_URL"
            echo ""
            echo "### Output"
            echo ""
            echo '```markdown'
            echo "$OUT" | head -c 60000
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
